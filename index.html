<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c1426"><title>One More Inch</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0b1427;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{display:flex;justify-content:space-between;align-items:start;padding:calc(env(safe-area-inset-top) + 17px) 18px 0;gap:12px}.pill{background:#0b1937bd;border:1px solid #ffffff29;border-radius:15px;padding:10px 14px;backdrop-filter:blur(10px);box-shadow:0 6px 24px #0003}.label{font-size:10px;letter-spacing:2px;color:#9fb7db;font-weight:800}.value{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 25px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px}#hold{pointer-events:auto;border:1px solid #ffffff77;color:#0d203d;background:linear-gradient(145deg,#ffe486,#ff9c3c);border-radius:999px;width:min(72vw,300px);height:82px;font-size:23px;font-weight:1000;box-shadow:0 10px 0 #b45c20,0 20px 35px #0008;touch-action:none;user-select:none;cursor:pointer}#hold:active,#hold.pressed{transform:translateY(6px);box-shadow:0 4px 0 #b45c20,0 12px 20px #0008}#hint{color:#d2e2fa;font-size:13px;text-align:center;text-shadow:0 2px 8px #000}#center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none}#panel{display:none;pointer-events:auto;background:linear-gradient(150deg,#152b50ed,#0a1530f5);border:1px solid #ffffff3b;border-radius:26px;padding:26px;width:min(90vw,380px);text-align:center;box-shadow:0 20px 90px #000b;backdrop-filter:blur(15px)}#panel h1{font-size:38px;line-height:1.05;margin:8px 0}#panel p{color:#c5d7f3;line-height:1.5}#panel .score{font-size:56px;font-weight:1000;color:#ffdc74}button.action{border:0;border-radius:14px;background:#ffcc64;color:#13233c;font-size:17px;font-weight:900;padding:16px;width:100%;margin-top:10px;cursor:pointer}button.secondary{background:#243e67;color:#fff}#toast{position:absolute;top:28%;left:10%;width:80%;text-align:center;font-size:23px;font-weight:1000;text-shadow:0 3px 15px #000;opacity:0;transition:opacity .2s}#meter{position:absolute;top:118px;left:50%;transform:translateX(-50%);width:min(78vw,350px);height:12px;border-radius:30px;background:#ffffff30;overflow:hidden;border:1px solid #ffffff50}#meterfill{height:100%;width:0;background:linear-gradient(90deg,#60edbc,#ffdf73,#ff6464);transition:width .07s}#mute{pointer-events:auto;position:absolute;right:18px;top:calc(env(safe-area-inset-top) + 100px);border:1px solid #ffffff55;background:#152745b0;color:white;border-radius:12px;padding:9px 12px;cursor:pointer}#intro{position:absolute;top:35%;left:10%;width:80%;text-align:center;text-shadow:0 3px 16px #0009}#intro h1{font-size:clamp(34px,8vw,60px);line-height:.98;margin:0 0 10px;font-weight:1000}#intro p{font-size:15px;color:#e3edff}#footer{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 5px);width:100%;text-align:center;font-size:10px;color:#ffffff77}</style></head><body><div id="ui"><div id="top"><div class="pill"><div class="label">LEVEL</div><div class="value" id="level">01</div></div><div class="pill" style="text-align:right"><div class="label">BEST STOP</div><div class="value" id="best">—</div></div></div><div id="meter"><div id="meterfill"></div></div><button id="mute">🔊</button><div id="toast"></div><div id="intro"><h1>ONE MORE<br>INCH</h1><p>Hold to roll. Release to brake.<br>Stop as close to the edge as you dare.</p></div><div id="center"><div id="panel"><div id="emoji" style="font-size:48px">🏆</div><h1 id="resultTitle">PERFECT STOP!</h1><div class="score" id="resultScore">0.00</div><div id="resultUnit">inches from the edge</div><p id="resultMessage"></p><button class="action" id="next">NEXT LEVEL →</button><button class="action secondary" id="retry">TRY AGAIN</button><button class="action secondary" id="share">SHARE SCORE ↗</button></div></div><div id="bottom"><div id="hint">HOLD TO ACCELERATE • RELEASE TO BRAKE</div><button id="hold">HOLD TO ROLL →</button></div><div id="footer">ONE MORE INCH • FREE WEB EDITION</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x80b8e7);scene.fog=new THREE.FogExp2(0x80b8e7,.011);const camera=new THREE.PerspectiveCamera(49,innerWidth/innerHeight,.1,300);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdff4ff,0x456081,2.1));const sun=new THREE.DirectionalLight(0xfff2d0,3.2);sun.position.set(-15,28,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c,r=.7,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const platformMat=mat(0x324e78),sideMat=mat(0x203653),edgeMat=mat(0xffd36b,.4,.1);function mesh(geo,material,x,y,z,shadow=true){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}const lane=mesh(new THREE.BoxGeometry(7,1.1,36),[platformMat,platformMat,mat(0x50739f),sideMat,platformMat,platformMat],0,-.6,-5); // edge at z=13
const edge=mesh(new THREE.BoxGeometry(7.3,.13,.38),edgeMat,0,.045,12.8);const stripeMat=mat(0xffffff);for(let z=-20;z<12;z+=3.5){const stripe=mesh(new THREE.BoxGeometry(.11,.025,1.5),stripeMat,0,.016,z,false)}
const ballGroup=new THREE.Group();scene.add(ballGroup);const ball= new THREE.Mesh(new THREE.SphereGeometry(.7,40,28),mat(0xff654e,.23,.25));ball.castShadow=true;ball.receiveShadow=true;ballGroup.add(ball);const ring=new THREE.Mesh(new THREE.TorusGeometry(.707,.075,8,64),mat(0xffe3aa,.32,.5));ring.rotation.x=Math.PI/2;ballGroup.add(ring);const spot=new THREE.Mesh(new THREE.SphereGeometry(.19,16,12),mat(0xffffff,.2));spot.position.set(.26,.37,.48);ballGroup.add(spot);
const clouds=[];for(let i=0;i<45;i++){const cloud=new THREE.Group();const cm=new THREE.MeshBasicMaterial({color:i%3===0?0xe5f5ff:0xffffff,transparent:true,opacity:.62});for(let j=0;j<3;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),cm);puff.scale.set(1.5+Math.random()*1.7,.3+Math.random()*.35,1+Math.random());puff.position.set(j*1.5,Math.random()*.15,Math.random());cloud.add(puff)}cloud.position.set((Math.random()-.5)*105,-7-Math.random()*11,(Math.random()-.5)*120);scene.add(cloud);clouds.push(cloud)}
const state={level:1,x:-18.8,v:0,holding:false,mode:'ready',score:0,attempt:0,last:performance.now(),mute:false};const EDGE=12.6,START=-18.8;let audio;function sound(freq,dur=.12,type='sine',vol=.07){if(state.mute)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.55),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function toast(s){$('toast').textContent=s;$('toast').style.opacity='1';setTimeout(()=>$('toast').style.opacity='0',1200)}function start(){if(state.mode==='result')return;state.holding=true;if(state.mode==='ready'){state.mode='rolling';$('intro').style.display='none';toast('GO!');sound(500)}$('hold').classList.add('pressed')}function stop(){state.holding=false;$('hold').classList.remove('pressed')}const btn=$('hold');btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);start()});btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)start()}});window.addEventListener('keyup',e=>{if(e.code==='Space')stop()});window.addEventListener('blur',stop);$('mute').onclick=()=>{state.mute=!state.mute;$('mute').textContent=state.mute?'🔇':'🔊'};
function reset(next=false){if(next)state.level++;state.x=START;state.v=0;state.mode='ready';state.holding=false;state.attempt++;ballGroup.rotation.set(0,0,0);$('level').textContent=String(state.level).padStart(2,'0');$('panel').style.display='none';$('intro').style.display='block';$('intro').innerHTML='<h1>LEVEL '+state.level+'</h1><p>'+(state.level>1?'Less grip. More speed. Same tiny edge.':'Hold to roll. Release to brake.<br>Stop as close as you dare.')+'</p>';$('hold').style.display='block';$('hint').style.display='block';$('meterfill').style.width='0%';stop()}
function finish(fell){state.mode='result';state.holding=false;const distance=Math.max(0,(EDGE-state.x-.7)*3.937);state.score=distance;let title,emoji,msg;if(fell){title='TOO FAR!';emoji='💥';msg='You went over the edge. Try braking earlier.';sound(140,.35,'sawtooth')}else if(distance<1){title='LEGENDARY!';emoji='👑';msg='Under an inch! You absolutely nailed it.';sound(900,.3)}else if(distance<8){title='SO CLOSE!';emoji='🔥';msg='An incredible stop. Can you get even closer?';sound(720,.22)}else{title='SAFE LANDING';emoji='🎯';msg='You made it! Try to stop closer next time.';sound(500,.18)}if(!fell){const best=Number(localStorage.getItem('omi-best')||Infinity);if(distance<best){localStorage.setItem('omi-best',String(distance));$('best').textContent=distance.toFixed(2)+'″';msg+=' New personal best!'}}$('resultTitle').textContent=title;$('emoji').textContent=emoji;$('resultScore').textContent=fell?'OVER':distance.toFixed(2);$('resultUnit').textContent=fell?'the edge':'inches from the edge';$('resultMessage').textContent=msg;$('next').style.display=fell?'none':'block';$('panel').style.display='block';$('hold').style.display='none';$('hint').style.display='none';$('intro').style.display='none'}
$('next').onclick=()=>reset(true);$('retry').onclick=()=>reset(false);$('share').onclick=async()=>{const s=state.score.toFixed(2);const text=state.x+.7>=EDGE?`I went over the edge in One More Inch 😅 Can you do better?`:`I stopped just ${s} inches from the edge in One More Inch! 🎯 Can you beat me?`;try{if(navigator.share)await navigator.share({title:'One More Inch',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);toast('CHALLENGE COPIED!')}}catch{}};const b=localStorage.getItem('omi-best');if(b)$('best').textContent=Number(b).toFixed(2)+'″';
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-state.last)/1000,.04);state.last=now;if(state.mode==='rolling'){const acceleration=state.holding?6.7+Math.min(state.level-1,12)*.35:-9.7+Math.min(state.level-1,10)*.28;state.v=Math.max(0,Math.min(18,state.v+acceleration*dt));const dx=state.v*dt;state.x+=dx;ballGroup.rotation.x-=dx/.7;$('meterfill').style.width=Math.min(100,Math.max(0,(state.x-START)/(EDGE-START)*100))+'%';if(state.x+.7>=EDGE){finish(true)}else if(!state.holding&&state.v===0&&state.x>START+.01){finish(false)}}ballGroup.position.set(0,.75,state.x);const mobile=innerWidth<650;const desired=new THREE.Vector3(mobile?10:13,mobile?11:12,state.x+(mobile?19:22));camera.position.lerp(desired,Math.min(1,dt*2.8));camera.lookAt(0,0,state.x+5);renderer.render(scene,camera)}requestAnimationFrame(animate);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});
