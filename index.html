<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1023"><title>Sort Rush</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1023;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-around;padding:12px 8px;pointer-events:none;font-size:12px;font-weight:800;text-shadow:0 2px 4px #000}#hud b{display:block;font-size:23px;text-align:center}#overlay{position:absolute;inset:0;background:#090e20d9;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}#panel{width:min(420px,100%);border:1px solid #ffffff25;border-radius:26px;background:linear-gradient(150deg,#24315b,#10172e);padding:30px 24px;text-align:center;box-shadow:0 25px 70px #0009}h1{font-size:48px;line-height:1;margin:0 0 14px;color:#6df6e3;text-shadow:0 4px 20px #25ddc677}p{line-height:1.55;color:#d4e1ff}button{border:0;background:linear-gradient(135deg,#42e6cc,#6a9bff);border-radius:15px;color:#0c1834;font-weight:900;font-size:18px;padding:16px 26px;min-height:52px;cursor:pointer}#pause{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 78px);padding:8px 13px;font-size:14px;background:#ffffff30;color:#fff;display:none}#toast{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:27px;font-weight:1000;pointer-events:none;text-shadow:0 3px 15px #000;opacity:0;transition:opacity .15s}small{color:#b9c9eb}#footer{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 10px);width:100%;text-align:center;font-size:12px;color:#d6e2ff9c;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud"><span>SCORE<b id="score">0</b></span><span>COMBO<b id="combo">x0</b></span><span>LIVES<b id="lives">♥♥♥</b></span><span>BEST<b id="best">0</b></span></div><button id="pause">Ⅱ</button><div id="toast"></div><div id="footer">TAP A PACKAGE OR PRESS 1 / 2 / 3 TO SORT</div><div id="overlay"><div id="panel"><h1 id="heading">SORT RUSH</h1><p id="message">Packages race down the conveyor. Tap each package to send it to its matching color bin. Build combos, survive the speed-up, and beat your best score!</p><button id="start">PLAY NOW</button><p><small>Works with one finger · No account · No ads</small></p></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),pause=document.getElementById('pause'),toast=document.getElementById('toast');const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),livesEl=document.getElementById('lives'),bestEl=document.getElementById('best');const colors=['#ff648a','#55dbff','#ffd36d'],names=['PINK','BLUE','GOLD'];let W=0,H=0,dpr=1,scale=1,laneX=[],beltTop=0,beltBottom=0,packages=[],particles=[],floating=[],score=0,combo=0,lives=3,best=Number(localStorage.getItem('sortRushBest')||0),state='menu',last=0,spawn=0,elapsed=0,shake=0,level=1,shift=0,toastTimer=0,audio=null;bestEl.textContent=best;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/390,H/780);laneX=[W*.22,W*.5,W*.78];beltTop=H*.17;beltBottom=H*.79}addEventListener('resize',resize);resize();function sound(freq=400){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.35,audio.currentTime+.08);g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch(e){}}function roundRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function txt(t,x,y,size,color='#fff',align='center'){ctx.fillStyle=color;ctx.font=`900 ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(t,x,y)}function particlesAt(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=70+Math.random()*200;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4+Math.random()*.4,color,r:2+Math.random()*4})}}function message(t){toast.textContent=t;toast.style.opacity='1';toastTimer=.8}function reset(){packages=[];particles=[];floating=[];score=0;combo=0;lives=3;spawn=.4;elapsed=0;level=1;shift=0;state='playing';overlay.style.display='none';pause.style.display='block';pause.textContent='Ⅱ';hud()}function hud(){scoreEl.textContent=score;comboEl.textContent='x'+combo;livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);bestEl.textContent=best}function finish(){state='over';pause.style.display='none';overlay.style.display='flex';document.getElementById('heading').textContent='GAME OVER';document.getElementById('message').innerHTML=`Score <b>${score}</b> · Best <b>${best}</b><br>Reached level ${level}. One more round?`;start.textContent='PLAY AGAIN'}function sortPackage(p){if(state!=='playing'||p.sorted)return;p.sorted=true;const correct=p.color===p.lane;const target=laneX[p.color];p.targetX=target;p.correct=correct;if(correct){combo++;score+=10+Math.min(combo,20)*2;sound(440+Math.min(combo,20)*35);particlesAt(p.x,p.y,colors[p.color],12);if(combo%10===0)message('🔥 '+combo+' COMBO!')}else{combo=0;lives--;shake=10;sound(160);particlesAt(p.x,p.y,'#fff',18);message('WRONG BIN!')}if(score>best){best=score;localStorage.setItem('sortRushBest',String(best))}hud();if(lives<=0)setTimeout(()=>{if(state==='playing')finish()},450)}function input(x,y){if(state!=='playing')return;let chosen=null,dist=1e9;for(const p of packages){if(p.sorted)continue;const d=Math.hypot(x-p.x,y-p.y);if(d<Math.max(48,40*scale)&&d<dist){chosen=p;dist=d}}if(chosen)sortPackage(chosen)}c.addEventListener('pointerdown',e=>{e.preventDefault();input(e.clientX,e.clientY)},{passive:false});document.addEventListener('keydown',e=>{if(state==='playing'&&['1','2','3'].includes(e.key)){const lane=Number(e.key)-1;const p=packages.filter(p=>!p.sorted&&p.lane===lane).sort((a,b)=>b.y-a.y)[0];if(p)sortPackage(p)}else if(e.key==='Escape')togglePause()});function togglePause(){if(state==='playing'){state='paused';pause.textContent='▶';overlay.style.display='flex';document.getElementById('heading').textContent='PAUSED';document.getElementById('message').textContent='Take a breather. The conveyor is waiting.';start.textContent='RESUME'}else if(state==='paused'){state='playing';overlay.style.display='none';pause.textContent='Ⅱ'}}start.addEventListener('click',()=>{if(state==='paused')togglePause();else reset()});pause.addEventListener('click',togglePause);function update(dt){if(state!=='playing')return;elapsed+=dt;level=1+Math.floor(elapsed/24);shift+=dt*(120+level*17);spawn-=dt;if(spawn<=0){const lane=Math.floor(Math.random()*3),color=Math.floor(Math.random()*3);packages.push({x:laneX[lane],y:beltTop-40*scale,lane,color,sorted:false,rot:Math.random()*.2-.1,spin:Math.random()*2-1});spawn=Math.max(.38,1.12-level*.075)*(0.8+Math.random()*.4)}const speed=(115+level*19)*scale;for(const p of packages){p.y+=speed*dt;if(p.sorted)p.x+=(p.targetX-p.x)*Math.min(1,dt*13);if(p.y>beltBottom+28*scale&&!p.sorted){p.sorted=true;combo=0;lives--;shake=8;message('MISSED!');hud();if(lives<=0)setTimeout(()=>{if(state==='playing')finish()},250)}}packages=packages.filter(p=>p.y<H+80);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=270*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake*=Math.pow(.03,dt);toastTimer-=dt;if(toastTimer<=0)toast.style.opacity='0'}function draw(){ctx.save();ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#19244a');bg.addColorStop(1,'#090e21');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);if(shake>1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);for(let i=0;i<35;i++){const x=(i*97.3)%W,y=(i*173.7+shift*.08)%H;ctx.fillStyle='#ffffff18';ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill()}const bw=W*.86,bx=(W-bw)/2;roundRect(bx-5,beltTop-10,bw+10,beltBottom-beltTop+55,23,'#060b19');roundRect(bx,beltTop,bw,beltBottom-beltTop+45,20,'#25365a');for(let j=0;j<3;j++){roundRect(laneX[j]-W*.125,beltTop+5,W*.25,beltBottom-beltTop+25,12,j%2?'#283a60':'#304368');ctx.fillStyle='#ffffff12';for(let y=beltTop+(shift%38)-38;y<beltBottom+24;y+=38){roundRect(laneX[j]-W*.115,y,W*.23,5,3,'#ffffff14')}}for(let i=1;i<3;i++)roundRect((laneX[i-1]+laneX[i])/2-2,beltTop,4,beltBottom-beltTop+30,2,'#6d84ae55');txt('TAP PACKAGES TO SORT',W/2,beltTop-27,Math.max(13,15*scale),'#b6d8ff');for(let i=0;i<3;i++){const w=W*.255,x=laneX[i]-w/2;ctx.shadowColor=colors[i];ctx.shadowBlur=17;roundRect(x,beltBottom+9,w,65*scale,13,colors[i]);ctx.shadowBlur=0;roundRect(x+5,beltBottom+14,w-10,53*scale,10,'#14203e');txt(['●','◆','★'][i],laneX[i],beltBottom+46*scale,27*scale,colors[i]);txt(names[i],laneX[i],beltBottom+64*scale,11*scale,'#fff')}for(const p of packages){const s=36*scale;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.shadowColor=colors[p.color];ctx.shadowBlur=15;roundRect(-s/2,-s/2,s,s,8*scale,colors[p.color]);ctx.shadowBlur=0;roundRect(-s*.36,-s*.36,s*.72,s*.2,4*scale,'#ffffff66');txt(['●','◆','★'][p.color],0,s*.18,s*.57,'#15223e');ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
